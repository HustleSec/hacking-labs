version: '3.8'
services:
  minio:
    image: minio/minio:latest
    container_name: minio-ctf
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - minio-network

  nginx:
    image: nginx:alpine
    container_name: nginx-cache
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cache:/var/cache/nginx
    depends_on:
      - minio
    networks:
      - minio-network

volumes:
  minio_data:

networks:
  minio-network:
    driver: bridge