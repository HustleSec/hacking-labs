version: '3.8'

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/company-bucket;
      mc mb local/secret-bucket;
      echo 'This is a normal file in the company bucket.' > /tmp/normal.txt;
      mc cp /tmp/normal.txt local/company-bucket/normal.txt;
      echo 'FLAG{you_exploited_the_nginx_s3_static_bypass}' > /tmp/flag.txt;
      mc cp /tmp/flag.txt 'local/secret-bucket/static/flag.txt';
      mc anonymous set download local/company-bucket;
      mc anonymous set download local/secret-bucket;
      echo 'Setup complete.';
      "

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - minio

volumes:
  minio-data: