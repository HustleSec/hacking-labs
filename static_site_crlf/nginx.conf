events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for Docker service names
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;  # Access via http://localhost

        # Global CSP header to block inline scripts
        add_header Content-Security-Policy "default-src 'self'; script-src 'self';" always;

        # Serve main static site
        root /var/www/html;
        index index.html;

        # Vulnerable location: proxies /static/ to MinIO with $uri CRLF injection
        location /static/ {
            resolver 127.0.0.11;  # Ensure resolution for upstream
            proxy_pass http://minio:9000$uri;
            proxy_set_header Host volga-static-site.minio;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fallback for other locations
        location / {
            try_files $uri $uri/ =404;
        }
    }
}